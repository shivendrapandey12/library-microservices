server:
  port: 8082

spring:
  application:
    name: member-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:members;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  jwt:
    # Must be identical in api-gateway. Use a long random value outside local development.
    secret: ${JWT_SECRET:local-dev-secret-change-me-local-dev-secret-change-me-123456}
    expiry-minutes: 60

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
