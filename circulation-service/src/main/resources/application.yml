server:
  port: 8083

spring:
  application:
    name: circulation-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:circulation;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

# Circuit breaker defaults applied to every Feign call (catalog-service, member-service).
# 404 and 409 are business answers, not failures, so they do not open the circuit.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        ignore-exceptions:
          - feign.FeignException$NotFound
          - feign.FeignException$Conflict
  timelimiter:
    configs:
      default:
        timeout-duration: 3s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
