services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  discovery-server:
    build:
      context: .
      args:
        MODULE: discovery-server
    ports:
      - "8761:8761"

  catalog-service:
    build:
      context: .
      args:
        MODULE: catalog-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/catalog_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_URL: http://discovery-server:8761/eureka
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started

  member-service:
    build:
      context: .
      args:
        MODULE: member-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/member_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_URL: http://discovery-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-local-dev-secret-change-me-123456}
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started

  circulation-service:
    build:
      context: .
      args:
        MODULE: circulation-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/circulation_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      EUREKA_URL: http://discovery-server:8761/eureka
    depends_on:
      mysql:
        condition: service_healthy
      discovery-server:
        condition: service_started

  api-gateway:
    build:
      context: .
      args:
        MODULE: api-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URL: http://discovery-server:8761/eureka
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-local-dev-secret-change-me-123456}
    depends_on:
      - discovery-server
      - catalog-service
      - member-service
      - circulation-service

volumes:
  mysql-data:
